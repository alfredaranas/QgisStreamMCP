# ═══════════════════════════════════════════════════════════════════
# QgisStreamMCP — supervisord configuration
# ═══════════════════════════════════════════════════════════════════
#
# Robustness notes (2026-08-06):
# - We avoid %(ENV_X)s for secrets: it depends on the supervisord process
#   having that env var at config-parse time, which fails when an operator
#   does `docker run image ...` without -e. Secrets are now handled by
#   wrapper shell scripts that read $QGIS_VNC_HTTP_PASSWORD / $QGIS_API_TOKEN
#   at process-exec time (later than config-parse). This keeps
#   docker-compose env-block as the canonical source of truth and makes
#   `docker run` debugging work too.
# - All processes run as root in this container; isolating to a non-root
#   user is non-trivial because Xvfb + x11vnc need $XAUTHORITY, etc.
#   The container itself is the security boundary (Tailscale bind, bearer
#   on /api/*, VNC + noVNC password).

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
environment=DISPLAY=":99",PYTHONUNBUFFERED="1",PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

# ── Window Manager (lightweight, needed for QGIS GUI) ───────────
[program:fluxbox]
command=/usr/bin/fluxbox -display :99
autostart=true
autorestart=true
startsecs=3
priority=5
stdout_logfile=/var/log/supervisor/fluxbox.log
stderr_logfile=/var/log/supervisor/fluxbox_err.log

# ── QGIS Desktop (GUI + PyQGIS bridge auto-loaded at startup) ────
[program:qgis]
command=/usr/bin/qgis --nologo --noversioncheck --noplugins
environment=DISPLAY=":99",QT_QPA_PLATFORM="xcb",PYTHONPATH="/app:/app/src",PYQGIS_STARTUP="/app/src/qgis_bridge.py",LIBGL_ALWAYS_SOFTWARE="1",GALLIUM_DRIVER="llvmpipe",LP_NUM_THREADS="4",QT_X11_NO_MITSHM="1",MESA_GL_VERSION_OVERRIDE="3.3"
directory=/data
autostart=true
autorestart=true
startsecs=15
startretries=3
priority=10
stdout_logfile=/var/log/supervisor/qgis.log
stderr_logfile=/var/log/supervisor/qgis_err.log

# ── QGIS Maximizer (one-shot: wait for QGIS window, maximize) ─
[program:qgis_maximize]
command=/app/maximize_qgis.sh
environment=DISPLAY=":99"
autostart=true
autorestart=false
startsecs=0
priority=12
stdout_logfile=/var/log/supervisor/maximize.log
stderr_logfile=/var/log/supervisor/maximize_err.log

# ── VNC Server (captures QGIS display) ───────────────────────────
[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -forever -shared -rfbauth /run/secrets/qgis_vnc_passwd -rfbport 5900 -noxdamage -noxrecord -noxfixes
environment=DISPLAY=":99",XDG_SESSION_TYPE="x11"
autostart=true
autorestart=true
startsecs=3
priority=15
stdout_logfile=/var/log/supervisor/x11vnc.log
stderr_logfile=/var/log/supervisor/x11vnc_err.log

# ── noVNC (WebSocket proxy — QGIS in browser) ────────────────────
# Wrapper script reads $QGIS_VNC_HTTP_PASSWORD at exec time. If unset, the
# wrapper logs a warning and disables HTTP auth (the VNC password still
# protects the upstream session, so VNC stays locked even without the
# HTTP layer — degrades gracefully for local debugging).
[program:novnc]
command=/app/novnc_wrapper.sh
autostart=true
autorestart=true
startsecs=3
priority=20
stdout_logfile=/var/log/supervisor/novnc.log
stderr_logfile=/var/log/supervisor/novnc_err.log

# ── REST API Server (health + external access) ───────────────────
[program:api_server]
command=python3 /app/src/api_server.py
environment=DISPLAY=":99"
autostart=true
autorestart=true
startsecs=5
priority=25
stdout_logfile=/var/log/supervisor/api.log
stderr_logfile=/var/log/supervisor/api_err.log

# ── MCP Server (Streamable HTTP on :8100) ────────────────────────
[program:mcp_server]
command=python3 /app/main_mcp.py
environment=DISPLAY=":99",PYTHONPATH="/app:/app/src"
autostart=true
autorestart=true
startsecs=5
priority=30
stdout_logfile=/var/log/supervisor/mcp.log
stderr_logfile=/var/log/supervisor/mcp_err.log

# ── MJPEG Stream Server (canvas capture) ─────────────────────────
[program:stream_server]
command=python3 /app/src/stream_server.py
environment=DISPLAY=":99"
autostart=true
autorestart=true
startsecs=3
priority=35
stdout_logfile=/var/log/supervisor/stream.log
stderr_logfile=/var/log/supervisor/stream_err.log

# ── Secondary MCP server (nkarasiak/qgis-mcp plugin + server, B5) ──────
# In-QGIS plugin (qgis_mcp_plugin/) is auto-loaded by QGIS from
# /root/.local/share/QGIS/QGIS3/profiles/default/python/plugins/qgis_mcp_plugin
# and binds a TCP socket on QGIS_MCP_PLUGIN_PORT (default 9876). This
# supervisor program runs the MCP server (qgis_mcp.server) that talks to
# that socket and exposes 100+ upstream tools on $QGIS_MCP_ADDON_PORT:8765.
[program:qgis_mcp_addon]
command=/app/qgis_mcp_addon_wrapper.sh
autostart=true
autorestart=true
startsecs=30
startretries=5
priority=50
stdout_logfile=/var/log/supervisor/qgis_mcp_addon.log
stderr_logfile=/var/log/supervisor/qgis_mcp_addon_err.log

# ── Autosave backup (runs at container start + every 1h) ──────────
# (B13) Backs up /data/jobs + qgis session log to /archive/system/ with
# 24 hourly + 30 daily retention.
[program:qgis_autosave]
command=/app/qgis_autosave.sh
environment=DISPLAY=":99"
autostart=true
autorestart=true
startsecs=5
priority=40
stdout_logfile=/var/log/supervisor/autosave.log
stderr_logfile=/var/log/supervisor/autosave_err.log
